# Prune wasmer's LLVM once and publish the result, so toolchain builds do not
# repeat a 457 MB download and a 2.7 GB unpack every time. Re-run only when
# LLVM_RELEASE changes.
#
#   wasmer tarball   457 MB  ->  2.7 GB unpacked
#   what we keep     768 MB  ->  115 MB packed
#
# Runs on a self-hosted runner by default: macOS minutes bill at 10x on a
# private repo, and one run of this is a third of a free month. Nothing is
# deleted unless the run is actually short of disk, and then only on a runner
# that is throwaway by two independent measures. Nothing here writes outside
# the runner workspace.
name: llvm

on:
  workflow_dispatch:
    inputs:
      release:
        description: "wasmer llvm-custom-builds release (e.g. 22.x)"
        default: "22.x"
      runner:
        description: "self-hosted | hosted"
        default: "self-hosted"

# Default repo token is read-only, which is what failed the first run at the
# upload step after six minutes of work.
permissions:
  contents: write

jobs:
  prune:
    runs-on: ${{ inputs.runner == 'hosted' && 'macos-14' || 'self-hosted' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # Disk and libzstd, checked before anything is built. Only a throwaway
      # runner may reclaim space, only when actually short, and only after two
      # independent checks agree it is one -- runner.environment can be set by
      # a mislabelled runner, the account name cannot.
      - name: prepare
        env:
          NEED: "12"       # GB: 2.7 GB unpack plus the 768 MB kept
        run: |
          avail() { df -g . | tail -1 | awk '{print $4}'; }
          reclaim() {
            [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "refusing on $RUNNER_ENVIRONMENT"; exit 1; }
            [ "$(id -un)" = runner ] || { echo "refusing as $(id -un)"; exit 1; }
            echo "hosted runner is short -- reclaiming Xcode"
            sudo rm -rf /Applications/Xcode*.app
            sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          }
          echo "$(avail) GB free, need $NEED"
          if [ "$(avail)" -lt "$NEED" ]; then
            if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then reclaim
            else echo "need $NEED GB, have $(avail) -- free space and re-run"; exit 1
            fi
            echo "$(avail) GB free"
            [ "$(avail)" -ge "$NEED" ] || { echo "still short"; exit 1; }
          fi

          # wasmer's LLVM binaries link Homebrew's libzstd and macOS ships none.
          if [ -e "$(brew --prefix zstd 2>/dev/null)/lib/libzstd.a" ]; then
            echo "zstd present"
          elif [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            brew install zstd
          else
            echo "zstd missing -- run: brew install zstd"; exit 1
          fi

      - name: fetch and prune
        env:
          LLVM_RELEASE: ${{ inputs.release }}
        run: ./build-rustc llvm

      - run: ./build-rustc llvm-pack

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: llvm-${{ inputs.release }}
          files: dist-llvm/*
          fail_on_unmatched_files: true
