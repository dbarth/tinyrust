# Prune wasmer's LLVM once and publish the result, so toolchain builds do not
# repeat a 457 MB download and a 2.7 GB unpack every time. Re-run only when
# LLVM_RELEASE changes.
#
#   wasmer tarball   457 MB  ->  2.7 GB unpacked
#   what we keep     768 MB  ->  115 MB packed
#
# Runs on GitHub's macOS runners: free on a public repo, 10x-billed on a
# private one. Third-party actions are pinned to commit SHAs rather than tags,
# so a repointed tag cannot change what executes here.
name: llvm

on:
  workflow_dispatch:
    inputs:
      release:
        description: "wasmer llvm-custom-builds release (e.g. 22.x)"
        default: "22.x"

# Default repo token is read-only, which is what failed the first run at the
# upload step after six minutes of work.
permissions:
  contents: write

jobs:
  prune:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing here deletes anything. The build needs disk and libzstd; check
      # for both and stop with a message naming the fix. A throwaway runner
      # that is short of space is a runner-image problem, not something a
      # workflow should paper over by deleting the developer tools.
      - name: prepare
        env:
          NEED: "12"       # GB: 2.7 GB unpack plus the 768 MB kept
        run: |
          avail=$(df -g . | tail -1 | awk '{print $4}')
          echo "$avail GB free, need $NEED"
          [ "$avail" -ge "$NEED" ] || { echo "not enough disk"; exit 1; }

          # wasmer's LLVM binaries link Homebrew's libzstd and macOS ships none.
          # Installing it is additive, so a throwaway runner may do it; a
          # developer machine is told what to run instead.
          if [ -e "$(brew --prefix zstd 2>/dev/null)/lib/libzstd.a" ]; then
            echo "zstd present"
          elif [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            brew install zstd
          else
            echo "libzstd.a missing -- brew install zstd"; exit 1
          fi

      - name: fetch and prune
        env:
          LLVM_RELEASE: ${{ inputs.release }}
        run: ./build-rustc llvm

      - run: ./build-rustc llvm-pack

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: llvm-${{ inputs.release }}
          files: dist-llvm/*
          fail_on_unmatched_files: true
