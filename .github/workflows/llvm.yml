# Build the LLVM the toolchain links against and publish it, so a toolchain
# build does not repeat it. Re-run only when the version changes.
#
# Eight jobs: four hosts, twice each. rustc links these archives statically, so
# an arm64 LLVM cannot build an Intel compiler, and the two build types are the
# two components a release carries. No suffix is -O3 and builds rustc-alt;
# -minsizerel builds the default rustc.
#
#   per job    ~7 min, ~3 GB peak
#   asset      tinyrust-llvm-<version>-<host>[-minsizerel].tar.xz, 49-62 MB
#
# No zstd step: -DLLVM_ENABLE_ZSTD=OFF, so nothing links it. That is the whole
# reason `build-rustc zstd` is no longer on the path here.
#
# Third-party actions are pinned to commit SHAs rather than tags, so a
# repointed tag cannot change what executes. The Linux jobs go through
# ./build-env, so the archives are built in the same pinned image the toolchain
# is later built in -- that image is what fixes the glibc floor.
name: llvm

on:
  workflow_dispatch:
    inputs:
      version:
        description: "LLVM release tag to build (e.g. 22.1.8)"
        default: "22.1.8"

# Default repo token is read-only; publishing needs this.
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, MinSizeRel]
        host:
          - { triple: aarch64-apple-darwin,      runner: macos-15 }
          - { triple: x86_64-apple-darwin,       runner: macos-15-intel }
          - { triple: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm }
          - { triple: x86_64-unknown-linux-gnu,  runner: ubuntu-latest }
    runs-on: ${{ matrix.host.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing here deletes anything. A throwaway runner that is short of
      # space is a runner-image problem, not something a workflow should paper
      # over by deleting the developer tools.
      - name: prepare
        env:
          NEED: "10"       # GB: 1.5 source, 1.1 build, 0.4 staged, with room
        run: |
          # -k rather than -g: BSD df has no -g on Linux and GNU df has no -g
          # at all. 1024-blocks are the one unit both agree on.
          avail=$(df -k . | tail -1 | awk '{print int($4/1048576)}')
          echo "$avail GB free, need $NEED"
          [ "$avail" -ge "$NEED" ] || { echo "not enough disk"; exit 1; }

      # A relabelled image would otherwise publish an arm64 LLVM as Intel.
      - name: check host
        run: |
          case "$(uname -s)/$(uname -m)/${{ matrix.host.triple }}" in
            Darwin/arm64/aarch64-apple-darwin) ;;
            Darwin/x86_64/x86_64-apple-darwin) ;;
            Linux/aarch64/aarch64-unknown-linux-gnu) ;;
            Linux/x86_64/x86_64-unknown-linux-gnu) ;;
            *) echo "runner is $(uname -s)/$(uname -m), job claims ${{ matrix.host.triple }}"
               exit 1 ;;
          esac

      # The Linux image carries both already; the macOS runners carry cmake but
      # not always ninja.
      - name: ninja
        if: runner.os == 'macOS'
        run: command -v ninja >/dev/null || brew install ninja

      - name: build
        env:
          LLVM_VERSION: ${{ inputs.version }}
          LLVM_BUILD_TYPE: ${{ matrix.build_type }}
        run: ./build-env ./build-llvm

      # One tag holds all eight: the names differ by host and build type, so
      # nothing collides and a re-run of one job replaces only its own asset.
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: llvm-${{ inputs.version }}
          files: dist-llvm/*
          fail_on_unmatched_files: true
