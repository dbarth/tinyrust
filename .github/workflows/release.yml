# Build a tinyrust toolchain on macOS and attach it to a release.
#
# Runs on GitHub's macOS runners: free on a public repo, 10x-billed on a
# private one. Third-party actions are pinned to commit SHAs rather than tags,
# so a repointed tag cannot change what executes here.
#
# Nothing outside the runner workspace is written or deleted: build-rustc
# confines itself to its own directory and mktemp -d, and `prepare` only
# reports what is missing.
#
# The awkward parts, all of them macOS-specific:
#
#   disk    the build leaves ~15 GB of intermediates for 233 MB of output, so
#           `prepare` refuses to start under 25 GB. The LLVM comes in
#           pre-pruned from the llvm workflow, so no runner sees the 2.7 GB
#           unpack. macos-14-arm64/20260629 reported 72 GB free *after* Xcode
#           was deleted; nothing deletes it now, so if `prepare` ever fails
#           here, Xcode is why and NEED is the knob.
#   arch    macos-14/15 runners are arm64; an x86_64 *host* toolchain needs
#           macos-13. std for both targets is cross-built from either.
#   clean   checkout wipes untracked files, so a self-hosted run refetches
#           rust/ each time. That is the price of not building on stale state;
#           llvm/ comes back from the cache.
#   zstd    wasmer's LLVM binaries link Homebrew's libzstd, and macOS ships
#           none, so the runner needs it before anything links.
#   signing binaries are ad-hoc signed by `build-rustc bundle`. That is enough
#           to run, but not notarized: a user who downloads the tarball in a
#           browser gets a Gatekeeper prompt. curl does not set the quarantine
#           bit, which is why the installer uses it.
name: release

env:
  LLVM_VERSION: "22.1.8"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish to"
        required: true
  # No push trigger. Releases are dispatched by hand, so a stray tag cannot
  # start a 36-minute build.

# Default repo token is read-only; creating a release needs this.
permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing here deletes anything. The build needs disk and libzstd; check
      # for both and stop with a message naming the fix. A throwaway runner
      # that is short of space is a runner-image problem, not something a
      # workflow should paper over by deleting the developer tools.
      - name: prepare
        env:
          NEED: "25"       # GB: ~15 GB of intermediates, with room
        run: |
          avail=$(df -g . | tail -1 | awk '{print $4}')
          echo "$avail GB free, need $NEED"
          [ "$avail" -ge "$NEED" ] || { echo "not enough disk"; exit 1; }

          # wasmer's LLVM binaries link Homebrew's libzstd and macOS ships none.
          # Installing it is additive, so a throwaway runner may do it; a
          # developer machine is told what to run instead.
          if [ -e "$(brew --prefix zstd 2>/dev/null)/lib/libzstd.a" ]; then
            echo "zstd present"
          elif [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            brew install zstd
          else
            echo "libzstd.a missing -- brew install zstd"; exit 1
          fi

      # The pruned artifact from the llvm workflow: 115 MB, unpacking to 768 MB.
      # Without it this step is a 457 MB download and a 2.7 GB unpack.
      - name: cache llvm
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llvm
          key: llvm-${{ env.LLVM_VERSION }}-darwin-aarch64-v1

      # A private repo's releases/download/... URL 404s even with a token --
      # only the API asset endpoint serves it, which is what `gh release
      # download` uses. build-rustc takes a file:// URL, so it stays unaware.
      # Once the repo is public the plain URL works and this can go back.
      - name: fetch llvm
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: tinyrust-llvm-${{ env.LLVM_VERSION }}-darwin-aarch64.tar.xz
        run: |
          gh release download llvm-22.x --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir "$RUNNER_TEMP" --clobber
          TINYRUST_LLVM_URL="file://$RUNNER_TEMP/$ASSET" ./build-rustc llvm

      - name: fetch rust
        run: ./build-rustc fetch

      - name: build
        env:
          RUSTC_LTO: fat       # dist refuses anything else
          RUSTC_STAGE: "2"
        run: |
          ./build-rustc configure
          ./build-rustc build

      - name: trim, strip, verify
        env: { RUSTC_STAGE: "2" }
        run: |
          ./build-rustc trim
          ./build-rustc strip
          ./build-rustc verify

      - name: package
        env:
          RUSTC_LTO: fat
          RUSTC_STAGE: "2"
          # Without this the manifest points at this runner's disk.
          TINYRUST_DIST_BASE: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}
        run: |
          ./build-rustc dist
          ls -l dist

      - name: measure
        env: { RUSTC_STAGE: "2" }
        run: ./build-rustc measure || true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
