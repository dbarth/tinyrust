# Build a tinyrust toolchain on macOS and attach it to a release.
#
# Runs on GitHub's macOS runners: free on a public repo, 10x-billed on a
# private one. Third-party actions are pinned to commit SHAs rather than tags,
# so a repointed tag cannot change what executes here.
#
# Nothing outside the runner workspace is written or deleted: build-rustc
# confines itself to its own directory and mktemp -d, and `prepare` only
# reports what is missing.
#
# The awkward parts, all of them macOS-specific:
#
#   disk    the build leaves ~15 GB of intermediates for 233 MB of output, so
#           `prepare` refuses to start under 25 GB. The LLVM comes in
#           pre-pruned from the llvm workflow, so no runner sees the 2.7 GB
#           unpack. macos-14-arm64/20260629 reported 72 GB free *after* Xcode
#           was deleted; nothing deletes it now, so if `prepare` ever fails
#           here, Xcode is why and NEED is the knob. The Intel image is the
#           untested one: macos-15-intel is a standard runner, free on a public
#           repo, but documented at 14 GB of storage against a NEED of 25. If
#           the x86_64 job stops at `prepare`, that is why, and the answer is a
#           larger runner rather than deleting the runner's tools.
#   arch    one job per host, because rustc, cargo and the four optional tools
#           are native binaries for the machine that built them. macos-15 is
#           arm64 and macos-15-intel is x86_64; macos-13 is gone and macos-14
#           is deprecated. Each job packs only its own rust-std -- that
#           artifact is keyed by target and built once, by the host that owns
#           it -- and `dist-merge` folds the two into the one manifest trustup
#           fetches. Nothing in the installer chooses: trustup already picks by
#           its own host triple.
#   clean   checkout wipes untracked files, so a self-hosted run refetches
#           rust/ each time. That is the price of not building on stale state;
#           llvm/ comes back from the cache.
#   zstd    wasmer's LLVM binaries link their build machine's Homebrew, and
#           librustc_driver links zstd too. Both now use the one `build-rustc
#           zstd` builds, pinned, so no runner installs anything.
#   signing binaries are ad-hoc signed by `build-rustc bundle`. That is enough
#           to run, but not notarized: a user who downloads the tarball in a
#           browser gets a Gatekeeper prompt. curl does not set the quarantine
#           bit, which is why the installer uses it.
name: release

env:
  LLVM_VERSION: "22.1.8"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish to"
        required: true
  # No push trigger. Releases are dispatched by hand, so a stray tag cannot
  # start a 36-minute build.

# Default repo token is read-only; creating a release needs this.
permissions:
  contents: write

jobs:
  build:
    strategy:
      # Let the other host finish rather than cancelling it, so one failure
      # reports both results. It does not make the release partial: `publish`
      # needs the whole matrix, and that is deliberate. Each host now owns one
      # rust-std, so an arm-only release would carry no x86_64 std at all --
      # worse for cross-compiling than what 0.1.0 shipped. Both hosts or
      # neither.
      fail-fast: false
      matrix:
        include:
          - host: aarch64-apple-darwin
            runner: macos-15
          - host: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Nothing here deletes anything. A throwaway runner that is short of
      # space is a runner-image problem, not something a workflow should paper
      # over by deleting the developer tools.
      - name: prepare
        env:
          NEED: "25"       # GB: ~15 GB of intermediates, with room
        run: |
          avail=$(df -g . | tail -1 | awk '{print $4}')
          echo "$avail GB free, need $NEED"
          [ "$avail" -ge "$NEED" ] || { echo "not enough disk"; exit 1; }

      # Confirm the runner is the host this job claims. A relabelled image
      # would otherwise build an arm64 toolchain and publish it as Intel.
      - name: check host
        run: |
          case "$(uname -m)/${{ matrix.host }}" in
            arm64/aarch64-apple-darwin|x86_64/x86_64-apple-darwin) ;;
            *) echo "runner is $(uname -m), job claims ${{ matrix.host }}"
               exit 1 ;;
          esac
          echo "$(uname -m) is ${{ matrix.host }}"

      # The only library our binaries link, built here and pinned to a version
      # and a hash. Must come before `llvm`: wasmer's tools are repointed at it,
      # and until they are, none of them start.
      - name: zstd
        run: ./build-rustc zstd

      # The pruned artifact from the llvm workflow: 115 MB, unpacking to 768 MB.
      # Without it this step is a 457 MB download and a 2.7 GB unpack. Keyed by
      # host: an arm64 LLVM cannot link an Intel compiler.
      - name: cache llvm
        id: llvm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: llvm
          key: llvm-${{ env.LLVM_VERSION }}-${{ matrix.host }}-v1

      # A private repo's releases/download/... URL 404s even with a token --
      # only the API asset endpoint serves it, which is what `gh release
      # download` uses. build-rustc takes a file:// URL, so it stays unaware.
      # Once the repo is public the plain URL works and this can go back.
      - name: fetch llvm
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: tinyrust-llvm-${{ env.LLVM_VERSION }}-${{ matrix.host }}.tar.xz
        run: |
          gh release download llvm-22.x --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir "$RUNNER_TEMP" --clobber
          TINYRUST_LLVM_URL="file://$RUNNER_TEMP/$ASSET" ./build-rustc llvm

      - name: fetch rust
        run: ./build-rustc fetch

      - name: build
        env:
          RUSTC_LTO: fat       # dist refuses anything else
          RUSTC_STAGE: "2"
        run: |
          ./build-rustc configure
          ./build-rustc build

      - name: trim, strip, verify
        env: { RUSTC_STAGE: "2" }
        run: |
          ./build-rustc trim
          ./build-rustc strip
          ./build-rustc verify

      # TARGETS defaults to this host's own target, so each job packs exactly
      # one rust-std and the two never collide in the release.
      - name: package
        env:
          RUSTC_LTO: fat
          RUSTC_STAGE: "2"
          # Without this the manifest points at this runner's disk.
          TINYRUST_DIST_BASE: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}
        run: |
          ./build-rustc dist
          ls -l dist

      # The packages this job just built, installed and used the way a reader of
      # the README would. It has caught a component with no entry point
      # (cargo-miri), a manifest trustup could not parse, and a tree that was
      # never trimmed -- none of which `verify` or `measure` look at. --dist
      # repoints the manifest at the local copy, since its URLs are the release
      # ones and the release does not exist yet.
      - name: check
        run: ./check --dist dist

      - name: measure
        env: { RUSTC_STAGE: "2" }
        run: ./build-rustc measure || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.host }}
          path: dist
          retention-days: 1

  # One channel manifest covers every host, the way channel-rust-stable.toml
  # does. trustup fetches that one file and selects by its own host triple, so
  # this is the step that makes an Intel install work -- not anything in
  # install.sh.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: hosts
          pattern: dist-*

      - name: merge manifests
        run: |
          ./build-rustc dist-merge release hosts/dist-*
          ls -l release

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release/*
          fail_on_unmatched_files: true
