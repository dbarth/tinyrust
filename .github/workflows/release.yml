# Publish a release from compiler artifacts rustc.yml already built. No build
# here: a release that changes only trustup, install.sh or packaging costs
# minutes rather than an hour per host, and ships the same compiler binaries
# rather than equivalent ones.
#
# Run rustc.yml first when rust or LLVM moves; otherwise its tag already holds
# what this needs.
name: release

env:
  RUSTC_TAG: "tiny-rustc-1.98.0-llvm-22.1.8"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish to"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One tar per host, each the dist directory as that host packed it.
      - name: fetch the compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p tars
          gh release download "$RUSTC_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.tar' --dir tars
          for t in tars/*.tar; do
            d="hosts/$(basename "$t" .tar)"
            mkdir -p "$d" && tar xf "$t" -C "$d"
          done
          ls hosts

      # One channel manifest covers every host, the way channel-rust-stable.toml
      # does: trustup fetches that one file and selects by its own host triple.
      # TINYRUST_DIST_BASE repoints every xz_url from the compiler tag to this
      # release, which is the only thing that has to change.
      - name: merge manifests
        env:
          TINYRUST_DIST_BASE: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}
        run: |
          ./build-rustc dist-merge release hosts/*
          ls -l release
          grep -m1 xz_url release/channel-rust-*.toml

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ inputs.tag }}
          files: release/*
          fail_on_unmatched_files: true
