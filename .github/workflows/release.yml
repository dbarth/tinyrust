# Build a tinyrust toolchain on macOS and attach it to a release.
#
# Runs on a self-hosted runner by default. macOS minutes bill at 10x on a
# private repo: a free month is 200 macOS minutes and one run of this is more
# than that. Set the runner input to `hosted` only on a public repo.
#
# Nothing is deleted unless a run is actually short of disk, and then only on
# a runner that is throwaway by two independent measures. build-rustc itself
# writes only inside its own directory and mktemp -d, so the runner workspace
# is the whole blast radius.
#
# The awkward parts, all of them macOS-specific:
#
#   disk    the build leaves ~15 GB of intermediates for 233 MB of output.
#           `prepare` measures and only then decides: a hosted runner may drop
#           Xcode to make room, a self-hosted one is told to free space itself.
#           macos-14-arm64/20260629 had 72 GB free after dropping Xcode, so the
#           reclaim may never fire. The LLVM comes in pre-pruned from the llvm
#           workflow, so neither runner sees the 2.7 GB unpack.
#   arch    macos-14/15 runners are arm64; an x86_64 *host* toolchain needs
#           macos-13. std for both targets is cross-built from either.
#   clean   checkout wipes untracked files, so a self-hosted run refetches
#           rust/ each time. That is the price of not building on stale state;
#           llvm/ comes back from the cache.
#   zstd    wasmer's LLVM binaries link Homebrew's libzstd, and macOS ships
#           none, so the runner needs it before anything links.
#   signing binaries are ad-hoc signed by `build-rustc bundle`. That is enough
#           to run, but not notarized: a user who downloads the tarball in a
#           browser gets a Gatekeeper prompt. curl does not set the quarantine
#           bit, which is why the installer uses it.
name: release

env:
  LLVM_VERSION: "22.1.8"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to publish to"
        required: true
      runner:
        description: "self-hosted | hosted"
        default: "self-hosted"
  # No push trigger. A tag push would create a run that a self-hosted runner
  # picks up unattended -- and one created while the runner is offline sits
  # queued for 24h, then starts at login. Releases are dispatched by hand.

# Default repo token is read-only; creating a release needs this.
permissions:
  contents: write

jobs:
  macos:
    runs-on: ${{ inputs.runner == 'hosted' && 'macos-14' || 'self-hosted' }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7

      # Disk and libzstd, checked before anything is built. Only a throwaway
      # runner may reclaim space, only when actually short, and only after two
      # independent checks agree it is one -- runner.environment can be set by
      # a mislabelled runner, the account name cannot.
      - name: prepare
        env:
          NEED: "25"       # GB: ~15 GB of intermediates, with room
        run: |
          avail() { df -g . | tail -1 | awk '{print $4}'; }
          reclaim() {
            [ "$RUNNER_ENVIRONMENT" = github-hosted ] || { echo "refusing on $RUNNER_ENVIRONMENT"; exit 1; }
            [ "$(id -un)" = runner ] || { echo "refusing as $(id -un)"; exit 1; }
            echo "hosted runner is short -- reclaiming Xcode"
            sudo rm -rf /Applications/Xcode*.app
            sudo rm -rf ~/Library/Developer/CoreSimulator/Caches
          }
          echo "$(avail) GB free, need $NEED"
          if [ "$(avail)" -lt "$NEED" ]; then
            if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then reclaim
            else echo "need $NEED GB, have $(avail) -- free space and re-run"; exit 1
            fi
            echo "$(avail) GB free"
            [ "$(avail)" -ge "$NEED" ] || { echo "still short"; exit 1; }
          fi

          # wasmer's LLVM binaries link Homebrew's libzstd and macOS ships none.
          if [ -e "$(brew --prefix zstd 2>/dev/null)/lib/libzstd.a" ]; then
            echo "zstd present"
          elif [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then
            brew install zstd
          else
            echo "zstd missing -- run: brew install zstd"; exit 1
          fi

      # The pruned artifact from the llvm workflow: 115 MB, unpacking to 768 MB.
      # Without it this step is a 457 MB download and a 2.7 GB unpack.
      - name: cache llvm
        id: llvm-cache
        uses: actions/cache@v6
        with:
          path: llvm
          key: llvm-${{ env.LLVM_VERSION }}-darwin-aarch64-v1

      - name: fetch llvm
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        env:
          TINYRUST_LLVM_URL: https://github.com/${{ github.repository }}/releases/download/llvm-22.x/tinyrust-llvm-${{ env.LLVM_VERSION }}-darwin-aarch64.tar.xz
        run: ./build-rustc llvm

      - name: fetch rust
        run: ./build-rustc fetch

      - name: build
        env:
          RUSTC_LTO: fat       # dist refuses anything else
          RUSTC_STAGE: "2"
        run: |
          ./build-rustc configure
          ./build-rustc build

      - name: trim, strip, verify
        env: { RUSTC_STAGE: "2" }
        run: |
          ./build-rustc trim
          ./build-rustc strip
          ./build-rustc verify

      - name: package
        env:
          RUSTC_LTO: fat
          RUSTC_STAGE: "2"
          # Without this the manifest points at this runner's disk.
          TINYRUST_DIST_BASE: https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag || github.ref_name }}
        run: |
          ./build-rustc dist
          ls -l dist

      - name: measure
        env: { RUSTC_STAGE: "2" }
        run: ./build-rustc measure || true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
